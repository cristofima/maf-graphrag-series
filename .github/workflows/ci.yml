name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"

# Cancel in-progress runs for the same branch/PR (best practice: save CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level: no permissions by default (least privilege).
# Each job declares only what it needs.
permissions: {}

# -----------------------------------------------------------------------
# Stage layout (best practice: one concern per job, fast feedback via parallelism)
#
#   lint ──────────┐
#                  ├──► test
#   typecheck ─────┘
#
# lint and typecheck run in parallel after setup.
# test only runs when both quality gates pass.
# -----------------------------------------------------------------------

jobs:
  # ── Stage 1a: Code formatting & lint rules ──────────────────────────
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev --frozen --no-build

      - name: Format check (ruff format)
        run: uv run --frozen --no-sync --no-build python -m ruff format src/ tests/ --check

      - name: Lint — critical errors
        run: uv run --frozen --no-sync --no-build python -m ruff check . --select E9,F63,F7,F82 --output-format github

      - name: Lint — full rule set
        run: uv run --frozen --no-sync --no-build python -m ruff check . --output-format github

  # ── Stage 1b: Static type checking (runs in parallel with lint) ─────
  typecheck:
    name: "Type Check"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev --frozen --no-build

      - name: Type check with mypy
        run: |
          uv run --frozen --no-sync --no-build python -m mypy src/core/ src/agents/ src/mcp_server/ src/workflows/ \
            --ignore-missing-imports \
            --no-error-summary

  # ── Stage 2: Tests (only after quality gates pass) ──────────────────
  test:
    name: "Test"
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history needed for accurate SonarQube Cloud analysis

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev --frozen --no-build

      - name: Run tests
        run: uv run --frozen --no-sync --no-build pytest --cov-report=xml --junitxml=junit.xml

      - name: Upload test & coverage artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

      - name: Coverage summary
        if: ${{ !cancelled() }}
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          format: markdown
          output: both

      - name: Add coverage summary to job summary
        if: ${{ !cancelled() }}
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Pytest Results"
          path: junit.xml
          reporter: python-xunit

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
