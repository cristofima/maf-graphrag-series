name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"

# Cancel in-progress runs for the same branch/PR (best practice: save CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level: no permissions by default (least privilege).
# Each job declares only what it needs.
permissions: {}

# -----------------------------------------------------------------------
# Stage layout (best practice: one concern per job, fast feedback via parallelism)
#
#   lint ──────────┐
#                  ├──► test
#   typecheck ─────┘
#
# lint and typecheck run in parallel after setup.
# test only runs when both quality gates pass.
# -----------------------------------------------------------------------

jobs:
  # ── Stage 1a: Code formatting & lint rules ──────────────────────────
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev --frozen --no-build

      - name: Format check (ruff format)
        run: uv run --frozen --no-sync --no-build python -m ruff format src/ tests/ --check

      - name: Lint — critical errors
        run: uv run --frozen --no-sync --no-build python -m ruff check . --select E9,F63,F7,F82 --output-format github

      - name: Lint — full rule set
        run: uv run --frozen --no-sync --no-build python -m ruff check . --output-format github

  # ── Stage 1b: Static type checking (runs in parallel with lint) ─────
  typecheck:
    name: "Type Check"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev --frozen --no-build

      - name: Type check with mypy
        run: |
          uv run --frozen --no-sync --no-build python -m mypy src/core/ src/agents/ src/mcp_server/ src/workflows/ \
            --ignore-missing-imports \
            --no-error-summary

  # ── Stage 2: Tests (only after quality gates pass) ──────────────────
  test:
    name: "Test"
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev --frozen --no-build

      - name: Run tests
        run: uv run --frozen --no-sync --no-build pytest
