name: Router Evaluation

on:
  workflow_call:
    outputs:
      route_match:
        description: "Matched vs evaluated routes (e.g., 19/20)."
        value: ${{ jobs.evaluate.outputs.route_match }}
      route_accuracy:
        description: "Computed route accuracy as decimal string."
        value: ${{ jobs.evaluate.outputs.route_accuracy }}
      route_threshold:
        description: "Minimum configured route accuracy threshold."
        value: ${{ jobs.evaluate.outputs.route_threshold }}
      route_gate_passed:
        description: "Whether the route-accuracy gate passed."
        value: ${{ jobs.evaluate.outputs.route_gate_passed }}
    inputs:
      ref:
        description: "Branch, tag, or SHA to evaluate (optional)."
        required: false
        type: string
        default: ""
      regenerate_data:
        description: "Regenerate eval_router_data.jsonl before evaluation (requires MCP data availability)."
        required: false
        default: true
        type: boolean
      run_batch_eval:
        description: "Run Azure AI batch evaluators (uses model tokens)."
        required: false
        default: true
        type: boolean
      publish_foundry:
        description: "Publish batch evaluation run to Azure AI Foundry."
        required: false
        default: false
        type: boolean
      run_redteam:
        description: "Run red-team safety scan (higher latency/cost)."
        required: false
        default: false
        type: boolean
      redteam_flow:
        description: "Red-team flow: cloud-model or local-agent."
        required: false
        default: "cloud-model"
        type: string
      min_route_accuracy:
        description: "Minimum required route accuracy in [0,1]."
        required: false
        default: "0.95"
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to evaluate (optional)."
        required: false
        type: string
      regenerate_data:
        description: "Regenerate eval_router_data.jsonl before evaluation (requires MCP data availability)."
        required: false
        default: false
        type: boolean
      run_batch_eval:
        description: "Run Azure AI batch evaluators (uses model tokens)."
        required: false
        default: true
        type: boolean
      publish_foundry:
        description: "Publish batch evaluation run to Azure AI Foundry."
        required: false
        default: false
        type: boolean
      run_redteam:
        description: "Run red-team safety scan (higher latency/cost)."
        required: false
        default: false
        type: boolean
      redteam_flow:
        description: "Red-team flow: cloud-model or local-agent."
        required: false
        default: "cloud-model"
        type: string
      min_route_accuracy:
        description: "Minimum required route accuracy in [0,1]."
        required: false
        default: "0.95"
        type: string

permissions: {}

jobs:
  evaluate:
    name: "Router Evaluation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      route_match: ${{ steps.route_metrics.outputs.route_match }}
      route_accuracy: ${{ steps.route_metrics.outputs.route_accuracy }}
      route_threshold: ${{ steps.route_metrics.outputs.route_threshold }}
      route_gate_passed: ${{ steps.route_metrics.outputs.gate_passed }}

    env:
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      AZURE_OPENAI_EVAL_CHAT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EVAL_CHAT_DEPLOYMENT }}
      AZURE_OPENAI_ROUTER_DEPLOYMENT: ${{ vars.AZURE_OPENAI_ROUTER_DEPLOYMENT }}
      AZURE_AI_PROJECT: ${{ secrets.AZURE_AI_PROJECT }}

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev --frozen --no-build

      - name: Regenerate router eval data
        if: ${{ inputs.regenerate_data }}
        run: |
          uv run python run_mcp_server.py > mcp-server.log 2>&1 &
          MCP_PID=$!
          echo "MCP_PID=$MCP_PID" >> "$GITHUB_ENV"
          sleep 10
          uv run python -m evaluation.scripts.generate_router_eval_data

      - name: Stop MCP server
        if: ${{ always() && env.MCP_PID != '' }}
        run: kill "$MCP_PID"

      - name: Compute route-accuracy metrics
        id: route_metrics
        env:
          MIN_ROUTE_ACCURACY: ${{ inputs.min_route_accuracy || '0.95' }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          dataset = Path("src/evaluation/datasets/eval_router_data.jsonl")
          rows = [
              json.loads(line)
              for line in dataset.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          decided = [row.get("route_match") for row in rows if isinstance(row.get("route_match"), bool)]
          ok = sum(1 for value in decided if value)
          total = len(decided)
          accuracy = (ok / total) if total else 0.0
          threshold = float(os.environ["MIN_ROUTE_ACCURACY"])
          gate_passed = "true" if accuracy >= threshold else "false"

          print(
              f"route_match={ok}/{total} "
              f"accuracy={accuracy:.4f} "
              f"threshold={threshold:.4f} "
              f"gate_passed={gate_passed}"
          )

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(f"route_match={ok}/{total}\n")
              fh.write(f"route_accuracy={accuracy:.4f}\n")
              fh.write(f"route_threshold={threshold:.4f}\n")
              fh.write(f"gate_passed={gate_passed}\n")
          PY

      - name: Enforce route-accuracy gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.route_metrics.outputs.gate_passed }}" != "true" ]]; then
            echo "Route gate failed: match=${{ steps.route_metrics.outputs.route_match }}, accuracy=${{ steps.route_metrics.outputs.route_accuracy }}, threshold=${{ steps.route_metrics.outputs.route_threshold }}"
            exit 1
          fi

      - name: Run router batch evaluation
        if: ${{ inputs.run_batch_eval && !inputs.publish_foundry }}
        run: uv run python -m evaluation.scripts.run_batch_evaluation --data eval_router_data.jsonl --no-custom

      - name: Run router batch evaluation and publish to Foundry
        if: ${{ inputs.run_batch_eval && inputs.publish_foundry }}
        run: uv run python -m evaluation.scripts.run_batch_evaluation --data eval_router_data.jsonl --no-custom --foundry

      - name: Run red-team safety scan
        if: ${{ inputs.run_redteam }}
        run: uv run python -m evaluation.scripts.run_redteam --flow "${{ inputs.redteam_flow }}"

      - name: Upload evaluation artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: router-evaluation-results
          path: |
            src/evaluation/datasets/eval_router_data.jsonl
            src/evaluation/results/evaluation_results.json
            src/evaluation/results/evaluation_report.md
            src/evaluation/results/redteam_results.json
            mcp-server.log
          retention-days: 14
          if-no-files-found: warn

      - name: Publish router evaluation summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## Router Evaluation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \\`${{ inputs.ref != '' && inputs.ref || github.sha }}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Regenerate data: \\`${{ inputs.regenerate_data }}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Batch eval: \\`${{ inputs.run_batch_eval }}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publish Foundry: \\`${{ inputs.publish_foundry }}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Red team: \\`${{ inputs.run_redteam }}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Route gate: \\`${{ steps.route_metrics.outputs.gate_passed }}\\` (match=${{ steps.route_metrics.outputs.route_match }}, accuracy=${{ steps.route_metrics.outputs.route_accuracy }}, threshold=${{ steps.route_metrics.outputs.route_threshold }})" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f src/evaluation/results/evaluation_report.md ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Evaluation report preview" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,40p' src/evaluation/results/evaluation_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Evaluation report: not generated in this run." >> "$GITHUB_STEP_SUMMARY"
          fi
