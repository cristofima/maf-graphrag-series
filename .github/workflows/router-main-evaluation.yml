name: Router Main Evaluation

on:
  push:
    branches: ["main"]
    paths:
      - "**.py"
      - "prompts/**"
      - "settings.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
      - ".github/workflows/router-evaluation.yml"
      - ".github/workflows/router-main-evaluation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  router_eval_changes_main:
    name: "Router Eval Change Detection (main)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_eval: ${{ steps.detect.outputs.run_eval }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect router-evaluation-impacting changes on main
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" || true)"
          else
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
          fi

          echo "Changed files between $BASE_SHA and $HEAD_SHA:"
          echo "$CHANGED_FILES"

          # Deny-list, not allow-list: router-eval-affecting paths (MCP tool schemas, prompts,
          # GraphRAG settings, agents/workflows/evaluation code, deps) are too easy to miss if we
          # only enumerate "known relevant" prefixes. Skip only for changes that are provably
          # doc/metadata-only; run the gate for everything else.
          NON_DOC_CHANGES="$(echo "$CHANGED_FILES" | grep -vE '(\.md$|^docs/|^LICENSE$|^\.gitignore$|^\.gitattributes$)' || true)"

          if [[ -n "$NON_DOC_CHANGES" ]]; then
            echo "run_eval=true" >> "$GITHUB_OUTPUT"
            echo "Relevant (non-doc) changes detected:"
            echo "$NON_DOC_CHANGES"
          else
            echo "run_eval=false" >> "$GITHUB_OUTPUT"
            echo "Only documentation/metadata changes detected."
          fi

  router_evaluation_main:
    name: "Router Evaluation (main Foundry + Red Team)"
    needs: [router_eval_changes_main]
    if: ${{ needs.router_eval_changes_main.outputs.run_eval == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/router-evaluation.yml
    with:
      ref: ${{ github.sha }}
      regenerate_data: true
      run_batch_eval: true
      publish_foundry: true
      run_redteam: true
      redteam_flow: "cloud-model"
      min_route_accuracy: "0.95"
    secrets: inherit
