name: Router PR Merge Gate

on:
  pull_request:
    branches: ["main"]
    types: [labeled]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
      - ".github/workflows/router-evaluation.yml"
      - ".github/workflows/router-pr-merge-gate.yml"
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      ref:
        description: "PR head SHA (optional for manual runs)."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  router_eval_changes:
    name: "Router Eval Change Detection (PR Merge Gate)"
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.label.name == 'ready-to-merge') || (github.event_name == 'pull_request_review' && github.event.action == 'submitted' && github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_eval: ${{ steps.detect.outputs.run_eval }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect router-evaluation-impacting changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"

          echo "Changed files between $BASE_SHA and $HEAD_SHA:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -E '^(src/agents/|src/evaluation/|src/workflows/|\.github/workflows/(ci|router-evaluation|router-pr-merge-gate)\.yml|pyproject\.toml|uv\.lock)'; then
            echo "run_eval=true" >> "$GITHUB_OUTPUT"
            echo "Relevant changes detected."
          else
            echo "run_eval=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes detected."
          fi

  router_evaluation:
    name: "Router Evaluation (PR Local Pre-Merge)"
    needs: [router_eval_changes]
    if: ${{ needs.router_eval_changes.outputs.run_eval == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/router-evaluation.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      regenerate_data: true
      run_batch_eval: true
      publish_foundry: false
      run_redteam: false
      redteam_flow: "cloud-model"
      min_route_accuracy: "0.95"
    secrets: inherit

  router_merge_gate:
    name: "Router Merge Gate (PR Local Batch)"
    needs: [router_eval_changes, router_evaluation]
    if: ${{ always() && ((github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.label.name == 'ready-to-merge') || (github.event_name == 'pull_request_review' && github.event.action == 'submitted' && github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'main')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUN_EVAL: ${{ needs.router_eval_changes.outputs.run_eval }}
      EVAL_RESULT: ${{ needs.router_evaluation.result }}
    steps:
      - name: Decide merge gate result
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUN_EVAL" != "true" ]]; then
            echo "No router/evaluation-impacting changes detected; local router batch gate not required."
            exit 0
          fi

          if [[ "$EVAL_RESULT" == "success" ]]; then
            echo "Router local pre-merge evaluation passed."
            exit 0
          fi

          echo "Router local pre-merge evaluation did not pass (result=$EVAL_RESULT)."
          exit 1
