[project]
name = "maf-graphrag-series"
version = "3.3.0"
description = "MAF + GraphRAG: Enterprise Knowledge Agents - A tutorial series on building knowledge graph-powered AI agents with Microsoft Agent Framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "graphrag",
    "microsoft-agent-framework",
    "mcp",
    "azure-openai",
    "knowledge-graph",
    "rag",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/cristofima/maf-graphrag-series"
Repository = "https://github.com/cristofima/maf-graphrag-series"
Documentation = "https://github.com/cristofima/maf-graphrag-series/tree/main/docs"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# ===== PART 1: GraphRAG Fundamentals =====
# Microsoft GraphRAG - Knowledge graph construction
graphrag = "~3.0.9"

# Data processing for parquet files and dataframes
pandas = "^2.3.0"
pyarrow = "^22.0.0"

# CLI formatting
rich = "^15.0.0"

# ===== PART 2: MCP Server + Agent Integration =====
# Environment configuration
python-dotenv = "^1.2.2"

# MCP server framework
fastmcp = "^3.4.4"
uvicorn = { version = "^0.51.0", extras = ["standard"] }

# ===== PART 3: Supervisor Agent Pattern =====
# Microsoft Agent Framework - Core agent abstractions and orchestration
agent-framework-core = "^1.11.0"
agent-framework-openai = "^1.10.1"

# Azure Identity for authentication
azure-identity = "^1.25.3"

# HTTP client for MCP integration
httpx = "^0.28.1"

# ===== PART 4: MCP Server + Agent Integration =====
agent-framework-orchestrations = "^1.0.0"

# ===== PART 5: Monitoring, Evaluation & Safety =====
# Azure AI Evaluation SDK with red team support
azure-ai-evaluation = { version = ">=1.18.1", extras = ["redteam"] }

# OpenTelemetry for agent monitoring
# Latest: 1.44.0 (2026-07-16), but azure-monitor-opentelemetry-exporter (as of 1.0.0b55)
# caps opentelemetry-sdk at <1.44.0, so we pin to the latest compatible line: 1.43.0.
# Breaking changes in 1.35 (LogRecordProcessor.emit→on_emit) and 1.39 (LogData removed)
# do NOT affect us — we use MAF's configure_otel_providers() abstraction.
opentelemetry-api = "~1.43.0"
opentelemetry-sdk = "~1.43.0"
azure-monitor-opentelemetry-exporter = "~1.0.0b55"

[tool.poetry.group.dev.dependencies]
# Testing framework
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"

# Type checking & linting
mypy = "^2.3.0"
ruff = "^0.15.22"

# Jupyter notebooks for exploration
jupyter = "^1.0.0"
ipykernel = "^6.28.0"

# Visualization libraries (for notebooks)
networkx = "^3.0"
matplotlib = "^3.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# ===== Tool Configuration =====

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --strict-markers --cov=src/core --cov=src/agents --cov=src/mcp_server --cov=src/workflows --cov=src/evaluation --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff.format]
# Black-compatible formatter settings (ruff format replaces black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["output", "cache", ".venv"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by ruff format)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/workflows/base.py" = ["UP035"]
"src/mcp_server/tools/types.py" = ["UP035"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["output", "cache", ".venv"]

[tool.coverage.run]
source = ["src/core", "src/agents", "src/mcp_server", "src/workflows"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
