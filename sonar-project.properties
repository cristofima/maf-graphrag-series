sonar.projectKey=cristofima_maf-graphrag-series
sonar.organization=cristofima

sonar.sources=src
sonar.tests=tests

# CI (.github/workflows/ci.yml) runs against Python 3.11; requires-python allows 3.11-3.12
sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml

# infra/versions.tf and infra/bootstrap/main.tf pin azurerm to "~> 4.0"
sonar.terraform.provider.azure.version=4.0
