sonar.projectKey=cristofima_maf-graphrag-series
sonar.organization=cristofima

sonar.sources=src
sonar.tests=tests

# CI (.github/workflows/ci.yml) runs against Python 3.11; requires-python allows 3.11-3.12
sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml

# __init__.py: omitted from local coverage too (pyproject.toml [tool.coverage.run]) — re-export boilerplate.
# example.py: standalone interactive demo script for src/maf_graphrag/core, not exercised by the test suite by design.
sonar.coverage.exclusions=**/__init__.py,src/maf_graphrag/core/example.py

# infra/versions.tf and infra/bootstrap/main.tf pin azurerm to "~> 4.0"
sonar.terraform.provider.azure.version=4.0
